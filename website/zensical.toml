[project]
site_name = "Spyglass"
site_description = "Logging and rollback for Paper servers."
# Served from GitHub Pages at medievalrp-net.github.io/Spyglass/.
site_url = "https://medievalrp-net.github.io/Spyglass/"
repo_url = "https://github.com/medievalrp-net/Spyglass"
repo_name = "medievalrp-net/Spyglass"
edit_uri = "edit/main/website/docs/"
copyright = "The plugin is GPL-3.0; the API is Apache-2.0."

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "guide/installation.md",
    "guide/quick-start.md",
    "guide/situations.md",
  ] },
  { "Using Spyglass" = [
    "guide/inspecting.md",
    "guide/searching.md",
    "guide/rollback.md",
    "guide/salvage.md",
    "guide/snapshots.md",
  ] },
  { "Running a server" = [
    "guide/databases.md",
    "guide/coreprotect.md",
    "guide/velocity.md",
    "guide/maintenance.md",
    "guide/troubleshooting.md",
  ] },
  { "Reference" = [
    "reference/commands.md",
    "reference/query.md",
    "reference/permissions.md",
    "reference/configuration.md",
    "reference/events.md",
    "reference/api.md",
  ] },
  { "Project" = [
    "project/ai-policy.md",
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/telescope"
repo = "fontawesome/brands/github"

# Dark first, like the xenondevs docs.
[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/medievalrp-net/Spyglass"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.gg/7kxDxMYKyW"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
# config.conf is HOCON, which Pygments doesn't know; Terraform's HCL is close.
pymdownx.highlight.extend_pygments_lang = [{ name = "hocon", lang = "terraform" }]
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
