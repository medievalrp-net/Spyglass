name: Release
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r[:space:]')
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?$ ]] || exit 1
          tag="v${base}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$base" == *-SNAPSHOT ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" --json isDraft --jq '.isDraft' > existing-release; then
            # Resume a draft whose upload was interrupted; never replace a published release.
            echo "publish=$(cat existing-release)" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.release.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.release.outputs.publish == 'true'
      - name: Test combined release packaging
        run: python3 -m unittest discover -s scripts/tests
      - name: Build and test matching dependencies
        if: steps.release.outputs.publish == 'true'
        run: |
          for mc in 26.1.2 26.2 26.3; do
            ./gradlew build -PminecraftTarget="$mc" --no-daemon --stacktrace
          done
      - name: Stage labeled assets
        if: steps.release.outputs.publish == 'true'
        run: python3 scripts/stage-release.py
      - name: Create or resume draft at this exact commit
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          title="${TAG#v}"
          title="${title%.0}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "Tag already exists without a release; verify its commit before publishing."; exit 1;
            fi
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "Spyglass $title" --notes-file dist/NOTES.md
          fi
          # A draft may be resumed only from the commit that originally created it.
          [[ "$(gh release view "$TAG" --json targetCommitish --jq '.targetCommitish')" == "$GITHUB_SHA" ]] || {
            echo "Draft belongs to a different commit; inspect it before retrying."; exit 1;
          }
          gh release upload "$TAG" dist/*.jar dist/SHA256SUMS --clobber
      - name: Publish release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release edit "$TAG" --draft=false --latest
      - name: Publish target-specific API to Central
        if: steps.release.outputs.publish == 'true'
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [[ -n "$CENTRAL_PORTAL_USERNAME" ]]; then
            for mc in 26.1.2 26.2 26.3; do
              ./gradlew publishAggregationToCentralPortal -PminecraftTarget="$mc" --no-daemon --stacktrace
            done
          else
            echo "Central credentials absent; API jars remain available in the GitHub release."
          fi
